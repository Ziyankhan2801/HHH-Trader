<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Product | HHH Traders</title>

  <meta
    name="description"
    content="View product details from HHH Traders."
  >

  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header class="topbar">
    <div class="wrap topbar-inner">

      <a href="index.html" class="logo-link logo">
        <img
          src="assets/logo.png"
          alt="HHH Traders Logo"
        >
      </a>

      <button
        id="hamburger"
        class="hamburger"
        aria-label="Open menu"
        aria-expanded="false"
      >
        ☰
      </button>

      <nav
        class="mainnav"
        id="mainnav"
        role="navigation"
        aria-label="Main navigation"
      >
        <a href="index.html">Home</a>
        <a href="index.html#products">Shop</a>
        <a href="index.html#testimonials">Testimonials</a>
        <a href="index.html#contact">Contact</a>
      </nav>

      <div class="actions">

        <button
          id="cart-toggle"
          class="btn small ghost"
          type="button"
        >
          Cart (<span id="cart-count">0</span>)
        </button>

        <a
          class="btn small"
          href="tel:+919588686992"
        >
          Call
        </a>

      </div>

    </div>
  </header>


  <!-- ================= PRODUCT DETAIL ================= -->

  <main class="wrap">

    <section class="product-detail-section">

      <div id="product-detail">

        <!-- JS will render product here -->

        <div class="catalog-state loading-state">

          <div class="loader"></div>

          <h3>Loading product...</h3>

          <p>Please wait.</p>

        </div>

      </div>

    </section>

  </main>


  <!-- ================= CART SIDEBAR ================= -->

  <aside
    id="cart-sidebar"
    class="cart-sidebar"
  >

    <div class="cart-header">

      <h3>Your Cart</h3>

      <button
        id="cart-close"
        type="button"
      >
        ✕
      </button>

    </div>


    <div
      id="cart-items"
      class="cart-items"
    >
      <!-- Cart items generated by JS -->
    </div>


    <div class="cart-footer">

      <strong>
        Total: ₹<span id="cart-total">0</span>
      </strong>

      <button
        onclick="orderWhatsApp()"
        class="btn-wa"
        type="button"
      >
        Order on WhatsApp
      </button>

      <button
        onclick="clearCart()"
        class="btn ghost small full-width-mobile"
        type="button"
      >
        Clear Cart
      </button>

    </div>

  </aside>


  <div id="overlay" class="overlay"></div>


  <!-- ================= FOOTER ================= -->

  <footer class="site-footer">

    <div class="wrap footer-inner">

      <div class="footer-brand">

        <strong>HHH Traders</strong>

        <p class="small muted">
          Wholesale & Retail • Fancy Cotton Dress Material
        </p>

      </div>


      <div class="footer-links">

        <a href="index.html#products">
          Shop
        </a>

        <a href="index.html#contact">
          Contact
        </a>

        <a
          href="https://wa.me/919021278856"
          target="_blank"
          rel="noopener noreferrer"
        >
          WhatsApp
        </a>

      </div>


      <div class="footer-social">

        <a
          href="https://wa.me/919021278856"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="WhatsApp"
        >
          <img
            src="assets/icons/whatsapp.svg"
            alt="WhatsApp"
          >
        </a>

        <a
          href="https://www.instagram.com/hhh_traders_"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram"
        >
          <img
            src="assets/icons/instagram.svg"
            alt="Instagram"
          >
        </a>

        <a
          href="https://www.facebook.com/share/1bUTPpbcL9/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Facebook"
        >
          <img
            src="assets/icons/facebook.svg"
            alt="Facebook"
          >
        </a>

      </div>

    </div>


    <div class="footer-bottom small muted">

      © <span id="year"></span>
      HHH Traders — All rights reserved.

    </div>

  </footer>


  <script src="script.js"></script>

  <script src="product.js"></script>

</body>
</html>
